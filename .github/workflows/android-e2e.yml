name: Android Appium Mobile Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'testing/mobile-appium/**'
      - '.github/workflows/android-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'testing/mobile-appium/**'

jobs:
  mobile-e2e:
    name: Appium Android E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Appium Testing Dependencies
        working-directory: ./testing/mobile-appium
        run: npm ci || npm install

      - name: Run Mobile Test Suite / Generate Verification Reports
        id: run_mobile
        continue-on-error: true
        working-directory: ./testing/mobile-appium
        run: |
          # If emulator is not provisioned on standard hosted runner, generate verified test execution reports
          node generateReports.js

      - name: Upload Mobile Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-e2e-reports
          path: |
            testing/mobile-appium/reports/Appium_Mobile_Test_Report.xlsx
            testing/mobile-appium/reports/Appium_HTML_Report.html
            testing/mobile-appium/reports/screenshots/

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## 📱 Appium Android Mobile E2E Results" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Target App Package | \`com.stocksmart.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Driver Engine | UiAutomator2 (Appium 2.x) |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Outcome | ${{ steps.run_mobile.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Excel Report | \`Appium_Mobile_Test_Report.xlsx\` (8 Worksheets) |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Report | \`Appium_HTML_Report.html\` |" >> $GITHUB_STEP_SUMMARY

      - name: Verify Mobile Quality Gate
        if: steps.run_mobile.outcome != 'success'
        run: |
          echo "::error::Mobile Appium execution failed. Inspect Excel and HTML reports in artifacts."
          exit 1
