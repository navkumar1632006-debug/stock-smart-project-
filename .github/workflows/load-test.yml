name: API Baseline Load Testing

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL (e.g., https://your-deployed-app.vercel.app or http://localhost:3000)'
        required: false
        default: 'http://localhost:3000'
  push:
    paths:
      - 'api/**'
      - 'server.ts'
      - 'scripts/load-test.js'
      - 'scripts/parseK6Summary.js'
      - '.github/workflows/load-test.yml'

jobs:
  load-test:
    name: Baseline Load Test (100 VUs / 1 min)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm ci

      - name: Start Local API Server (if localhost target)
        id: server_start
        run: |
          TARGET_URL="${{ github.event.inputs.target_url || 'http://localhost:3000' }}"
          echo "Target URL is $TARGET_URL"
          if [[ "$TARGET_URL" == *"localhost"* || "$TARGET_URL" == *"127.0.0.1"* ]]; then
            echo "Starting background Express server..."
            npx tsx server.ts &
            # Poll health endpoint until online (up to 30s)
            for i in {1..30}; do
              if curl -s http://localhost:3000/api/health | grep -q "ok"; then
                echo "Server is ready!"
                break
              fi
              echo "Waiting for server to start... ($i/30)"
              sleep 1
            done
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        id: k6_run
        continue-on-error: true
        env:
          BACKEND_URL: ${{ github.event.inputs.target_url || 'http://localhost:3000' }}
        run: |
          k6 run --summary-export=summary.json scripts/load-test.js

      - name: Parse & Generate Excel & Markdown Reports
        id: parse_report
        run: |
          node scripts/parseK6Summary.js

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-load-test-reports
          path: |
            summary.json
            API_Load_Test_Report.xlsx

      - name: Check Load Test Status
        if: steps.k6_run.outcome != 'success'
        run: |
          echo "::error::k6 load test failed or threshold breached. Check summary and report artifacts."
          exit 1
