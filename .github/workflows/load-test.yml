name: API Baseline Load Testing

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL (e.g., http://localhost:3000)'
        required: false
        default: 'http://localhost:3000'
  push:
    paths:
      - 'api/**'
      - 'server.ts'
      - 'testing/performance/**'
      - '.github/workflows/load-test.yml'

jobs:
  load-test:
    name: Baseline Load Test (100 VUs / 1 min)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Performance Dependencies
        run: |
          npm ci
          cd testing/performance && npm ci || npm install

      - name: Start Local API Server (if localhost target)
        id: server_start
        run: |
          TARGET_URL="${{ github.event.inputs.target_url || 'http://localhost:3000' }}"
          echo "Target URL is $TARGET_URL"
          if [[ "$TARGET_URL" == *"localhost"* || "$TARGET_URL" == *"127.0.0.1"* ]]; then
            echo "Starting background Express server..."
            npx tsx server.ts &
            for i in {1..30}; do
              if curl -s http://localhost:3000/api/health | grep -q "ok"; then
                echo "Server is ready!"
                break
              fi
              echo "Waiting for server to start... ($i/30)"
              sleep 1
            done
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        id: k6_run
        continue-on-error: true
        env:
          BACKEND_URL: ${{ github.event.inputs.target_url || 'http://localhost:3000' }}
        run: |
          mkdir -p testing/performance/reports
          k6 run --summary-export=testing/performance/reports/summary.json testing/performance/load-test.js

      - name: Parse & Generate Excel & HTML Reports
        id: parse_report
        working-directory: ./testing/performance
        run: |
          node parseK6Summary.js reports/summary.json

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-load-test-reports
          path: |
            testing/performance/reports/summary.json
            testing/performance/reports/API_Load_Test_Report.xlsx
            testing/performance/reports/API_Load_Test_Report.html

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## ⚡ API Baseline Load Test Results (k6)" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Target URL | ${{ github.event.inputs.target_url || 'http://localhost:3000' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Virtual Users | 100 VUs |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | 60 Seconds (1m) |" >> $GITHUB_STEP_SUMMARY
          echo "| Execution Status | ${{ steps.k6_run.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Excel Report | \`API_Load_Test_Report.xlsx\` (7 Worksheets) |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Report | \`API_Load_Test_Report.html\` |" >> $GITHUB_STEP_SUMMARY

      - name: Check Load Test Quality Gate
        if: steps.k6_run.outcome != 'success'
        run: |
          echo "::error::k6 load test failed or threshold breached. Check summary and report artifacts."
          exit 1
