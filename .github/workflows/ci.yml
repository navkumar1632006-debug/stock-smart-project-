name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci

      - name: Run Unit Tests (Vitest)
        run: npx vitest run

      - name: Typecheck Root (Web / Backend)
        run: npx tsc --noEmit

      - name: Typecheck Mobile (React Native / Expo)
        working-directory: mobile
        run: npx tsc --noEmit
