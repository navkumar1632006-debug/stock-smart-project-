name: Web Selenium E2E Automation Testing

on:
  workflow_dispatch:
    inputs:
      test_base_url:
        description: 'Base URL of target web app'
        required: false
        default: 'http://localhost:3000'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'testing/web-e2e/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'testing/web-e2e/**'

jobs:
  selenium-e2e:
    name: Selenium Chrome E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Selenium E2E Dependencies
        working-directory: ./testing/web-e2e
        run: npm ci || npm install

      - name: Start Background Web Application
        run: |
          TARGET_URL="${{ github.event.inputs.test_base_url || 'http://localhost:3000' }}"
          echo "Target URL is $TARGET_URL"
          if [[ "$TARGET_URL" == *"localhost"* || "$TARGET_URL" == *"127.0.0.1"* ]]; then
            echo "Starting background Express/Vite server..."
            npx tsx server.ts &
            for i in {1..30}; do
              if curl -s http://localhost:3000/api/health | grep -q "ok"; then
                echo "Web application server is ready!"
                break
              fi
              echo "Waiting for app to start... ($i/30)"
              sleep 1
            done
          fi

      - name: Execute Selenium E2E Tests
        id: run_e2e
        continue-on-error: true
        working-directory: ./testing/web-e2e
        env:
          BASE_URL: ${{ github.event.inputs.test_base_url || 'http://localhost:3000' }}
          HEADLESS: "true"
        run: |
          npm test

      - name: Generate Reports if not already emitted
        if: always()
        working-directory: ./testing/web-e2e
        run: |
          node generateReports.js

      - name: Upload Test Report Artifacts (Excel, HTML & Screenshots)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-web-e2e-reports
          path: |
            testing/web-e2e/reports/Selenium_Test_Report.xlsx
            testing/web-e2e/reports/Selenium_HTML_Report.html
            testing/web-e2e/reports/screenshots/

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## 🌐 Selenium Web E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Target URL | ${{ github.event.inputs.test_base_url || 'http://localhost:3000' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser Engine | Google Chrome (Headless) |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Outcome | ${{ steps.run_e2e.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Excel Report | \`Selenium_Test_Report.xlsx\` (8 Worksheets) |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Report | \`Selenium_HTML_Report.html\` |" >> $GITHUB_STEP_SUMMARY

      - name: Verify E2E Execution Quality Gate
        if: steps.run_e2e.outcome != 'success'
        run: |
          echo "::error::Selenium Web E2E test execution failed. Inspect HTML and Excel reports in artifacts."
          exit 1
